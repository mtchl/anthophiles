[build]
  command = "npm run build"
  publish = "dist"

# Hashed build output never changes for a given filename
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts are versioned by filename and effectively static
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dataset has a stable filename, so revalidate rather than cache forever
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
